# Staged nginx config for the public registry endpoint.
# Charles installs it with:
#   sudo cp nginx-registry.conf /etc/nginx/sites-available/registry
#   sudo ln -s /etc/nginx/sites-available/registry /etc/nginx/sites-enabled/registry
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d registry.onthe1.app
# (certbot adds the TLS server block automatically)

server {
    listen 80;
    server_name registry.onthe1.app;

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # embedding + search can take a few seconds on first model load
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
